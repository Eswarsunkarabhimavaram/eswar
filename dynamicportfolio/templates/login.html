<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ESWAR</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="login-page">


<div class="login-box">


    <div class="login-logo">

        ESWAR

    </div>


    <h1>
        Admin Login
    </h1>


    <p>
        Login to manage your portfolio
    </p>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="error">

                {{ message }}

            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">


        <label>
            Username
        </label>


        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">

            Login to Dashboard

        </button>


    </form>


    <a href="/"
       class="back">

        ← Back to Portfolio

    </a>


</div>


</body>

</html>
